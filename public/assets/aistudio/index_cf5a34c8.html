:root {
  --bg: #F1F4F2;
  --surface: #FFFFFF;
  --surface-2: #E8EFEC;
  --ink: #13262A;
  --muted: #566A6E;
  --line: #D3DDD9;
  --accent: #0B6B58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DAEEE7;
  --ok: #1D7A3A;
  --ok-soft: #DDF1E3;
  --warn: #8F5B00;
  --warn-soft: #FBEFD0;
  --bad: #B3261E;
  --bad-soft: #FBE2DF;
  --shadow: 0 1px 2px rgba(19, 38, 42, 0.06), 0 8px 24px rgba(19, 38, 42, 0.08);
  --f-display: 'Schibsted Grotesk', system-ui, -apple-system, sans-serif;
  --f-body: 'Public Sans', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}

body {
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  padding: 0;
}

h1, h2, h3, h4 {
  font-family: var(--f-display);
  letter-spacing: -0.01em;
}

.font-mono-code {
  font-family: var(--f-mono);
}

.font-display {
  font-family: var(--f-display);
}

.num-tabular {
  font-variant-numeric: tabular-nums;
}

@media print {
  @page {
    margin: 20mm 20mm 20mm 20mm;
  }

  body[data-paper-size="legal"] {
    @page {
      size: legal portrait;
      margin: 20mm 20mm 20mm 20mm;
    }
  }

  body[data-paper-size="a4"],
  body:not([data-paper-size]) {
    @page {
      size: A4 portrait;
      margin: 20mm 20mm 20mm 20mm;
    }
  }

  /* Hide app navigation and interactive elements */
  header,
  aside,
  nav,
  .no-print,
  button,
  .btn-action-bar,
  .role-switcher,
  .fixed.inset-0.bg-black\/60,
  .fixed.inset-0.bg-black\/50 {
    background: transparent !important;
  }

  body {
    background: #ffffff !important;
    color: #000000 !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }

  /* Printable Word document sheet */
  .print-sheet {
    box-shadow: none !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 auto !important;
    width: 100% !important;
    max-width: 100% !important;
    page-break-inside: avoid !important;
  }
}

/* Cetak rekap mutasi: sembunyikan seluruh aplikasi, tampilkan hanya lembar rekap */
@media print {
  body.printing-rekap #root {
    display: none !important;
  }
  body.printing-rekap {
    background: #ffffff !important;
  }
  body.printing-rekap th {
    background-color: #f3f4f6 !important;
    -webkit-print-color-adjust: exact;

  }

/* ===== Kwitansi BKU (ukuran sedang 210 x 148 mm) ===== */
.kw-sheet{width:210mm;height:147mm;box-sizing:border-box;padding:6mm 8mm;background:#fff;color:#000;font-family:'Times New Roman',Times,serif;overflow:hidden;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.kw-frame{height:100%;box-sizing:border-box;border:1.1pt solid #000;padding:3.5mm 6mm 3mm;display:flex;flex-direction:column}
.kw-kop{display:flex;align-items:center;padding-bottom:1.4mm;border-bottom:3pt double #000}
.kw-side{display:flex;align-items:center;gap:1mm;flex:none}
.kw-logo{max-height:13mm;max-width:14mm;object-fit:contain}
.kw-kop-text{flex:1;text-align:center;line-height:1.15}
.kw-k1{font-size:8.5pt;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.kw-k2{font-size:12pt;font-weight:700;letter-spacing:.03em}
.kw-k3{font-size:7.5pt;font-style:italic}
.kw-title{text-align:center;font-weight:700;font-size:15pt;letter-spacing:.35em;text-decoration:underline;margin-top:3mm}
.kw-no{text-align:center;font-size:10pt;margin-bottom:3.5mm}
.kw-row{display:flex;font-size:11.5pt;line-height:1.4;margin-bottom:2mm}
.kw-l{width:33mm;flex:none}
.kw-c{width:4mm;flex:none}
.kw-v{flex:1;min-width:0;border-bottom:.6pt dotted #000;overflow-wrap:anywhere}
.kw-terbilang{display:inline-block;border:.8pt solid #000;padding:.2mm 2mm;font-weight:700;font-style:italic}
.kw-kode{font-size:8.5pt;margin:-.5mm 0 1mm 37mm;color:#222}
.kw-mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:1.5mm}
.kw-amtbox{border:1.1pt solid #000;padding:1mm 4mm;font-weight:700;font-size:13pt;transform:skewX(-8deg)}
.kw-date{font-size:10pt}
.kw-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;text-align:center;font-size:9.5pt;line-height:1.25;margin-top:1mm}
.kw-gap{height:15mm;display:flex;align-items:center;justify-content:center}
.kw-materai{border:.6pt dashed #000;font-size:6pt;padding:2.5mm 3mm;line-height:1.1}
.kw-name{font-weight:700;text-decoration:underline;font-size:9.5pt;min-height:1.2em}
.kw-nip{font-size:8pt}

.kw-layout{display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.kw-layout{grid-template-columns:330px minmax(0,1fr)}}
.kw-list{max-height:520px;overflow:auto}
#kw-print-root{display:none}
@media print{
  body.printing-kwitansi #root{display:none !important}
  body.printing-kwitansi #kw-print-root{display:block !important}
  body.printing-kwitansi .kw-sheet{break-after:page;page-break-after:always}
  body.printing-kwitansi .kw-sheet:last-child{break-after:auto;page-break-after:auto}
}
